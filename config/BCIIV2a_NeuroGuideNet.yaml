dataset:
  name: 'BCIIV2a'
  root: 'F:\AI\Dataset\BCIC\BCICIV_2a_gdf'
  batch_size: 64
  test_batch_size: 64
  num_workers: 0
  filter_order: 5
  fs: 250
  data_len: 4
  rta_num: 1
  window_size: 4
  window_stride: 0.2
  random_flip_p1: 0.3
  segment_reassemble_p1: 0.5
  segment_reassemble_split_num: 4
  label_name: ['left', 'right', 'foot', 'tongue']
  map_transform: False
  filter_start: 0.5
  filter_end: 45
  factor_new: 0.001

model:
  n_channels: 22
  num_class: 4
  use_input_conv: True
  in_channels: 1
  in_kernel: 15
  avg_pool_size: 1
  map_size: [6, 7]
  use_center_loss: True
  use_conv_fuse: False
  localRST_module:
    block_dims: [16, 32]
    pool_size: [8, 8]
    block_kernels: [15, 31]
    dropout: 0.3
    channel_fuse_idx: 0
  globalRST_module:
    ch_size: 22
    block_dims: [16, 32]
    pool_size: [8, 8]
    block_kernels: [15, 31]
    dropout: 0.3
    channel_fuse_idx: 0
  cross_region_fc_module:
    block_dims: [32, 32]
    pool_size: [2, 1]
    block_kernels: [15, 31]
    n_heads_list: [4, 4]
    ch_size: 7
    dropout: 0.3

train:
  epoch: 440
  load_param: None
  base_lr: 0.001
  use_R_Drop: True
  R_Drop_alpha: 1
  use_center_loss: True
  center_loss_lambda: 0.01
  epsilon: 1.0e-8
  weight_decay: 0.001
  t_max: 40
  min_learning_rate: 1.0e-5
  max_grad_norm: 5
  save_every_n_epochs: 50
  patience: 200
